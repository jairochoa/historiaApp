<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid mt-4">
            <a class="navbar-brand" href="#">🩺 Clínica Obstétrica Dra. Yasmin Ramírez</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button id="backup-btn" class="btn btn-outline-light">Crear Copia de Seguridad</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-md-6">
                <button id="add-patient-btn" class="btn btn-primary">Nuevo Paciente</button>
            </div>
            <div class="col-md-6">
                <input type="text" id="search-bar" class="form-control" placeholder="Buscar por cédula o nombre...">
            </div>
        </div>

        <div class="row">
            <div class="col-md-2">
                <div class="card">
                    <div class="card-header fw-bold">
                        Lista de Pacientes
                    </div>
                    <ul id="patient-list" class="list-group list-group-flush">
                        </ul>
                </div>
            </div>

            <div class="col-md-10">
                <div id="patient-details">
                    <div class="card">
                        <div class="card-body text-center">
                            <p class="text-muted">Selecciona un paciente de la lista para ver sus detalles.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="add-patient-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Registrar Nuevo Paciente</h2>
            <form id="patient-form">
                <input type="text" id="cedula" name="cedula" placeholder="Cédula de Identidad" required>
                <input type="text" id="nombres" name="nombres" placeholder="Nombres" required>
                <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                <input type="tel" id="telefono" name="telefono" placeholder="Teléfono">
                <input type="text" id="domicilio" name="domicilio" placeholder="Domicilio">
                <textarea id="comentario" name="comentario" placeholder="Comentario..." rows="3"></textarea>
                <button type="submit" class="btn btn-primary w-100">Guardar Paciente</button>
            </form>
        </div>
    </div>

    <div id="add-consultation-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Añadir Nueva Consulta</h2>
            <form id="consultation-form">
                <input type="date" id="fur" name="fur" required>
                <textarea id="motivo_consulta" placeholder="Motivo de la consulta..." required></textarea>
                <button type="submit" class="btn btn-primary w-100">Guardar Consulta</button>
            </form>
        </div>
    </div>

    <div id="view-consultation-modal" class="modal">
        <div class="modal-content modal-lg"> <span class="close-btn">&times;</span>
            <h2>Detalles de la Consulta</h2>
            <div id="consultation-details-content">
                </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
