<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🩺 Dra. Yasmin D. Ramírez M. / Ginecóloga y Obstetra</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Pacientes</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Reportes</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Ver Todas las Citologías</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center ms-lg-3">
                    <button id="add-patient-btn" class="btn btn-light text-primary fw-bold">Nuevo Paciente</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2">
                <div class="mb-2">
                    <input type="text" id="search-bar" class="form-control" placeholder="Buscar paciente...">
                </div>
                <div class="card">
                    <div class="card-header fw-bold">Lista de Pacientes</div>
                    <ul id="patient-list" class="list-group list-group-flush">
                        </ul>
                </div>
            </div>
            <div class="col-md-10">
                <div id="patient-details">
                    <div class="card">
                        <div class="card-body text-center"><p class="text-muted">Selecciona un paciente.</p></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="add-patient-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Registrar Nuevo Paciente</h2>
            <form id="patient-form" class="mt-3">
                <div class="mb-2">
                    <input type="text" id="cedula" class="form-control" placeholder="Cédula de Identidad" required>
                </div>
                <div class="mb-2">
                    <input type="text" id="nombres" class="form-control" placeholder="Nombres" required>
                </div>
                <div class="mb-2">
                    <input type="text" id="apellidos" class="form-control" placeholder="Apellidos" required>
                </div>
                <div class="mb-2">
                    <input type="date" id="fecha_nacimiento" class="form-control">
                </div>
                <div class="mb-2">
                    <input type="tel" id="telefono" class="form-control" placeholder="Teléfono">
                </div>
                <div class="mb-2">
                    <input type="text" id="domicilio" class="form-control" placeholder="Domicilio">
                </div>
                <div class="mb-2">
                    <textarea id="comentario" class="form-control" placeholder="Comentario..." rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar Paciente</button>
            </form>
        </div>
    </div>

    <div id="add-consultation-modal" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-btn">&times;</span>
            <h2>Añadir Nueva Consulta</h2>
            <form id="consultation-form">
            <div class="consultation-details-grid">
                <div>
                    <label for="fecha_consulta">Fecha de Consulta:</label>
                    <input type="date" id="fecha_consulta" name="fecha_consulta" class="form-control" readonly>
                </div>
                <div>
                    <label for="fur">Fecha de Última Regla (FUR):</label>
                    <input type="date" id="fur" name="fur" class="form-control" required>
                </div>
                <div class="grid-span-2">
                    <label for="motivo_consulta">Motivo de Consulta:</label>
                    <textarea id="motivo_consulta" class="form-control" rows="2" required></textarea>
                </div>
                <div class="grid-span-2">
                    <label for="diagnostico">Diagnóstico:</label>
                    <textarea id="diagnostico" class="form-control" rows="2"></textarea>
                </div>
                <div class="grid-span-2">
                    <label for="plan">Plan:</label>
                    <textarea id="plan" class="form-control" rows="2"></textarea>
                </div>
                <div>
                    <label>Gestas:</label>
                    <div class="input-group">
                        <span class="input-group-text">P</span>
                        <input type="number" id="gestas_parto" class="form-control" value="0">
                        <span class="input-group-text">C</span>
                        <input type="number" id="gestas_cesarea" class="form-control" value="0">
                        <span class="input-group-text">A</span>
                        <input type="number" id="gestas_aborto" class="form-control" value="0">
                    </div>
                </div>
                <div class="grid-span-2">
                    <label for="medio_pago">Medio de Pago:</label>
                    <select id="medio_pago" class="form-select">
                        <option value="Efectivo">Efectivo</option>
                        <option value="PagoMovil">PagoMóvil</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>
                </div>
                 <div class="grid-span-2">
                    <label for="anticonceptivos">Anticonceptivos:</label>
                    <textarea id="anticonceptivos" class="form-control" rows="2"></textarea>
                </div>
                <div class="grid-span-2">
                    <label for="antecedentes_personales">Antecedentes Personales:</label>
                    <textarea id="antecedentes_personales" class="form-control" rows="2"></textarea>
                </div>
                <div class="grid-span-2">
                    <label for="antecedentes_familiares">Antecedentes Familiares:</label>
                    <textarea id="antecedentes_familiares" class="form-control" rows="2"></textarea>
                </div>
                 <div class="grid-span-2">
                    <label for="examen_fisico">Examen Físico:</label>
                    <textarea id="examen_fisico" class="form-control" rows="2"></textarea>
                </div>
                 <div class="grid-span-2">
                    <label for="ecografia">Ecografía:</label>
                    <textarea id="ecografia" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Guardar Consulta</button>
        </form>
        </div>
    </div>

    <div id="view-consultation-modal" class="modal">
        <div class="modal-content modal-lg">
            <span class="close-btn">&times;</span>
            <h2>Detalles de la Consulta</h2>
            <div id="consultation-details-content" class="mt-3"></div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
