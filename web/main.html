<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Médico</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestor de Pacientes</h1>
            <button id="add-patient-btn" class="btn">Nuevo Paciente</button>
            <div class="search-container">
                <input type="text" id="search-bar" placeholder="Buscar por cédula o nombre...">
            </div>
        </header>
        
        <main>
            <div class="patient-list-container">
                <h2>Lista de Pacientes</h2>
                <ul id="patient-list">
                    </ul>
            </div>
            
            <div class="patient-detail-container">
                <h2>Detalles del Paciente</h2>
                <div id="patient-details">
                    <p>Selecciona un paciente de la lista para ver sus detalles.</p>
                </div>
            </div>
        </main>
    </div>

    <div id="add-patient-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Registrar Nuevo Paciente</h2>
            <form id="patient-form">
                <input type="text" id="cedula" name="cedula" placeholder="Cédula de Identidad" required>
                <input type="text" id="nombres" name="nombres" placeholder="Nombres" required>
                <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                <input type="tel" id="telefono" name="telefono" placeholder="Teléfono">
                <input type="text" id="domicilio" name="domicilio" placeholder="Domicilio">
                <textarea id="comentario" name="comentario" placeholder="Comentario..."></textarea>
                <button type="submit" class="btn">Guardar Paciente</button>
            </form>
        </div>
    </div>

    <div id="add-consultation-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Registrar Nueva Consulta</h2>
            <form id="consultation-form">
                <input type="date" id="fur" name="fur" required>
                <input type="number" id="gestas_parto" name="gestas_parto" placeholder="Partos" required>
                <input type="number" id="gestas_cesarea" name="gestas_cesarea" placeholder="Cesáreas" required>
                <input type="number" id="gestas_aborto" name="gestas_aborto" placeholder="Abortos" required>
                <input type="text" id="anticonceptivos" name="anticonceptivos" placeholder="Anticonceptivos" required>
                <input type="text" id="antecedentes_personales" name="antecedentes_personales" placeholder="Antecedentes Personales" required>
                <input type="text" id="antecedentes_familiares" name="antecedentes_familiares" placeholder="Antecedentes Familiares" required>
                <input type="text" id="motivo_consulta" name="motivo_consulta" placeholder="Motivo Consulta" required>
                <input type="text" id="examen_fisico" name="examen_fisico" placeholder="Examen Físico" required>
                <input type="text" id="ecografia" name="ecografia" placeholder="Ecografia" required>
                <input type="text" id="diagnostico" name="diagnostico" placeholder="Diagnóstico" required>
                <input type="text" id="plan" name="plan" placeholder="Plan" required>
                <select id="medio_pago" name="medio_pago">
                    <option value="Efectivo">Efectivo</option>
                    <option value="PagoMovil">PagoMóvil</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
                <button type="submit" class="btn">Guardar Paciente</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
